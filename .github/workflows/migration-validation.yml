name: Migration Validation

on:
  push:
    branches: [fix/production-database-bootstrap]
  pull_request:
    branches: [main]

jobs:
  validate-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      - name: Run migrations from base to head
        env:
          DATABASE_URL_SYNC: postgresql://postgres:postgres@localhost:5432/mig_fresh
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE mig_fresh;"
          alembic upgrade head
      - name: Run migrations from previous head to head
        env:
          DATABASE_URL_SYNC: postgresql://postgres:postgres@localhost:5432/mig_upgrade
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE mig_upgrade;"
          # Upgrade to previous revision then to head
          alembic upgrade 0018ca6cfb19
          alembic upgrade head
      - name: Verify schema against models
        env:
          DATABASE_URL_SYNC: postgresql://postgres:postgres@localhost:5432/mig_fresh
        run: |
          python -m pytest tests/test_migration_schema.py -v
